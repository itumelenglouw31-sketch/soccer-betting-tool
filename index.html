<!DOCTYPE html>
<html>
<head>
  <title>Soccer Betting Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Soccer Betting Analysis</h2>

<label>League</label>
<select id="league"></select>

<label>Team A</label>
<select id="teamA"></select>

<label>Team B</label>
<select id="teamB"></select>

<button onclick="analyze()">Analyze Match</button>
<button onclick="analyze()">Analyze Match</button>

<h3>Set Confidence (%) for Each Market</h3>

<label>Straight Win</label>
<input type="number" id="confWin" value="80" min="0" max="100">

<label>Double Chance</label>
<input type="number" id="confDouble" value="70" min="0" max="100">

<label>Over 1.5 Goals</label>
<input type="number" id="confOver" value="90" min="0" max="100">

<label>BTTS</label>
<input type="number" id="confBTTS" value="60" min="0" max="100">

<label>Corners</label>
<input type="number" id="confCorners" value="50" min="0" max="100">

<label>Cards</label>
<input type="number" id="confCards" value="40" min="0" max="100">

<h3>Presets:</h3>
<div id="preset-buttons">
  <button type="button" onclick="preset('Quick Pick')">Quick Pick</button>
  <button type="button" onclick="preset('Value Bet')">Value Bet</button>
  <button type="button" onclick="preset('High Confidence')">High Confidence</button>
</div>

<div id="result"></div>

<div id="result"></div>

<script src="app.js"></script>
</body>
</html>
